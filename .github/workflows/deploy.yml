name: Data Platform CD Pipeline

on:
  schedule:
    # Daily automated deployment for dev environment at 05:00 UTC.
    - cron: '0 5 * * *'

  # Manual trigger for specific environment deployments.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  # ====================================================
  # Deployment to Development Environment (Dev)
  # Automated execution of plan and apply.
  # ====================================================
  deploy-dev:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev') ||
      (github.event_name == 'schedule' || github.event.inputs.environment == 'dev')

    runs-on: self-hosted
    environment: dev 
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_AWS_ROLE_ARN }} 
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Pre-deployment validation: execute module unit tests.
      - name: Unit Test Monitoring Module
        working-directory: ./modules/monitoring
        run: |
          terraform init
          terraform test

      - name: Terraform Init, Validate & Fmt
        working-directory: ./environments/dev
        run: |
          terraform init
          terraform validate
          terraform fmt -check

      - name: Terraform Plan & Apply (Dev)
        working-directory: ./environments/dev
        run: |
          terraform plan
          terraform apply -auto-approve

  # ====================================================
  # Production Deployment Step 1: Planning
  # Generates and uploads a sealed execution plan.
  # ====================================================
  plan-prod:
    if: github.event_name != 'schedule' && github.event.inputs.environment == 'prod'
    runs-on: self-hosted 
    permissions:
      id-token: write
      contents: read

    outputs:
      tf_plan_artifact_name: ${{ steps.upload-artifact.outputs.artifact-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }} 
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init, Validate & Fmt
        working-directory: ./environments/prod
        run: |
          terraform init
          terraform validate
          terraform fmt -check

      - name: Terraform Plan (Prod)
        working-directory: ./environments/prod
        run: |
          # Generate and output plan file for verification.
          terraform plan -out=tfplan

      - name: Upload Plan Artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-tfplan-${{ github.sha }}
          path: terraform/prod/tfplan

  # ====================================================
  # Production Deployment Step 2: Approval & Execution
  # Downloads the plan and executes upon manual approval.
  # ====================================================
  apply-prod:
    needs: plan-prod
    if: github.event_name != 'schedule' && github.event.inputs.environment == 'prod'
    runs-on: self-hosted 
    
    # Environment 'prod' triggers manual approval requirement.
    environment:
      name: prod
      url: 'https://console.aws.amazon.com/kinesisanalytics/home' 

    concurrency:
      group: prod-deployment
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan-prod.outputs.tf_plan_artifact_name }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        working-directory: ./environments/prod
        run: terraform init

      - name: Terraform Apply (Prod)
        working-directory: ./environments/prod
        run: |
          # Apply the sealed plan artifact.
          terraform apply -input=false tfplan
