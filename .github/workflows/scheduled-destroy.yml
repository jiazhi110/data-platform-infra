name: Cost Optimization - Nightly Teardown

on:
  schedule:
    # Daily automated destruction of dev environment at 11:00 UTC.
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual trigger.

jobs:
  destroy-dev:
    name: Destroy Dev Environment
    runs-on: self-hosted
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_AWS_ROLE_ARN }} 
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./environments/dev
        run: terraform init -reconfigure

      # Remove specific Kafka resources from state to avoid dependency issues during cluster destruction.
      - name: Remove Kafka Resources from State
        working-directory: ./environments/dev
        run: |
          terraform state rm 'module.ingestion.kafka_acl.ec2_runner_consumer_acl' || true
          terraform state rm 'module.ingestion.kafka_acl.ec2_runner_consumer_group_acl' || true
          terraform state rm 'module.ingestion.kafka_acl.flink_consumer_acl' || true
          terraform state rm 'module.ingestion.kafka_acl.flink_consumer_group_acl' || true
          terraform state rm 'module.ingestion.kafka_acl.mock_data_producer_acl' || true
          terraform state rm 'module.ingestion.kafka_acl.terraform_topic_creator_acl' || true
          terraform state rm 'module.ingestion.kafka_topic.produce_events' || true

      - name: Terraform Destroy
        working-directory: ./environments/dev
        run: terraform destroy -auto-approve